name: Deploy to Test VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update Test VM
        run: |
          cd /var/www/test-app
          git pull origin main

      - name: Verify deployment
        run: |
          echo "Deployment completed on:"
          hostname
          echo "Current version:"
          cat /var/www/test-app/index.html
